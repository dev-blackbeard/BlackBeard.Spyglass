name: Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.1). Leave blank to derive from the pushed tag (vX.Y.Z)."
        required: false
  release:
    types: [published]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: publish to nuget.org
    # WPF (UseWPF=true) only builds on Windows, unlike this org's plain-class-library repos -
    # this job can't move to ubuntu-latest.
    runs-on: windows-latest

    # A deployment environment, so publishing needs whatever approval the repository's environment
    # protection rules require. Publishing is the one irreversible step in this repository: a
    # package version, once pushed, cannot be replaced.
    environment: nuget
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, ahead of SourceLink if that gets added later

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore BlackBeard.Spyglass.sln

      - name: Verify before publishing
        run: dotnet test tests/BlackBeard.Spyglass.Tests/BlackBeard.Spyglass.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Pack
        run: dotnet pack src/BlackBeard.Spyglass/BlackBeard.Spyglass.csproj --configuration Release --no-restore --output artifacts -p:Version=${{ steps.version.outputs.value }}

      # Trusted Publishing: exchanges this run's GitHub OIDC token (hence `permissions: id-token:
      # write` above) for a short-lived (1-hour) nuget.org API key, matched against a policy
      # configured on nuget.org (owner, repo, workflow file, environment). No long-lived secret
      # stored here - "blackbeard" is a public nuget.org username, not a credential.
      - name: NuGet login (OIDC -> short-lived key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: blackbeard

      # dotnet nuget push does not expand "*.nupkg" itself (verified live: it errors with "File
      # does not exist" for a literal glob argument), so enumerate the actual file(s) instead of
      # relying on shell/CLI glob expansion.
      - name: Push
        shell: pwsh
        run: |
          $apiKey = "${{ steps.login.outputs.NUGET_API_KEY }}"
          $packages = Get-ChildItem -Path artifacts -Filter *.nupkg
          if ($packages.Count -eq 0) {
            throw "No .nupkg files found in artifacts/"
          }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key $apiKey --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              throw "dotnet nuget push failed for $($package.Name) with exit code $LASTEXITCODE"
            }
          }
