name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-pack:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"

      - name: Restore
        run: dotnet restore BlackBeard.Spyglass.sln

      - name: Build
        run: dotnet build BlackBeard.Spyglass.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/BlackBeard.Spyglass.Tests/BlackBeard.Spyglass.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/BlackBeard.Spyglass/BlackBeard.Spyglass.csproj --configuration Release --no-build --output artifacts

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlackBeard.Spyglass-nupkg
          path: artifacts/*.*nupkg
